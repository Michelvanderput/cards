name: Cards
options:
  bundleIdPrefix: nl.michelvanderput
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 85CDCL9Q43
    CODE_SIGN_STYLE: Automatic
targets:
  Cards:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Cards, Shared]
    dependencies:
      - target: CardsWidget
    entitlements:
      path: Cards/Cards.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers: [iCloud.nl.michelvanderput.cards]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.nl.michelvanderput.cards]
        com.apple.security.application-groups: [group.nl.michelvanderput.cards]
    info:
      path: Cards/Info.plist
      properties:
        CFBundleDisplayName: Cards
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [nl.michelvanderput.cards.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelvanderput.cards
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 85CDCL9Q43
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CardsWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources: [Widget, Shared]
    entitlements:
      path: Widget/CardsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.nl.michelvanderput.cards]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Cards
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelvanderput.cards.widget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CardsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Cards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelvanderput.cardstests
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Cards.app/Contents/MacOS/Cards
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
        TEST_HOST[sdk=iphone*]: $(BUILT_PRODUCTS_DIR)/Cards.app/Cards
        BUNDLE_LOADER[sdk=iphone*]: $(TEST_HOST)
schemes:
  Cards:
    build:
      targets:
        Cards: all
    test:
      targets: [CardsTests]
