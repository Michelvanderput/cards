name: Cards
options:
  bundleIdPrefix: nl.michelvanderput
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cards:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Cards]
    entitlements:
      path: Cards/Cards.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Cards/Info.plist
      properties:
        CFBundleDisplayName: Cards
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [nl.michelvanderput.cards.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelvanderput.cards
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 85CDCL9Q43
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
